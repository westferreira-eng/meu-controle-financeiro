<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Controle Financeiro</title></head><body><div id="status" style="font-family:system-ui;padding:40px;text-align:center">Carregando Meu Controle Financeiro…</div><script>(async()=>{try{const names=[0,1,2,3,4,5,6,7].map(n=>`/appdata/part0${n}.txt?v=20260913`);const rs=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'})));for(let i=0;i<rs.length;i++)if(!rs[i].ok)throw new Error(`Arquivo ${names[i]} não encontrado (HTTP ${rs[i].status})`);const parts=await Promise.all(rs.map(r=>r.text()));let b64=parts.join('').replace(/[^A-Za-z0-9+/=]/g,'').replace(/=/g,'');while(b64.length%4)b64+='=';const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<h2 style="color:#c33">Não foi possível carregar o sistema</h2><p style="color:#555">'+String(e.message).replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))+'</p>'}})()</script></body></html>
