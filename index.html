<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Controle Financeiro</title></head><body><div style="font-family:system-ui;padding:40px;text-align:center">Carregando Meu Controle Financeiro…</div><script>(async()=>{try{const names=[0,1,2,3,4,5,6,7].map(n=>`/appdata/part0${n}.txt`);const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(`${n}: HTTP ${r.status}`);return (await r.text()).replace(/[^A-Za-z0-9+/=]/g,'')}));const decoded=parts.map((p,i)=>{try{return atob(p)}catch(e){throw new Error(`Falha na parte ${i}: base64 inválido`)}});const total=decoded.reduce((a,s)=>a+s.length,0);const bytes=new Uint8Array(total);let o=0;for(const s of decoded){for(let i=0;i<s.length;i++)bytes[o++]=s.charCodeAt(i)}const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="font-family:system-ui;padding:40px;color:#c33"><h2>Não foi possível carregar o sistema</h2><p>'+e.message+'</p></div>'}})()</script></body></html>
