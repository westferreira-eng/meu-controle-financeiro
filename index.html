<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Controle Financeiro</title></head><body><div style="font-family:system-ui;padding:40px;text-align:center">Carregando Meu Controle Financeiro…</div><script>(async()=>{try{const names=[0,1,2,3,4,5,6,7].map(n=>`appdata/part0${n}.txt`);const parts=await Promise.all(names.map(n=>fetch(n).then(r=>r.text())));const b64=parts.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="font-family:system-ui;padding:40px;color:#c33"><h2>Não foi possível carregar o sistema</h2><p>'+e.message+'</p></div>'}})()</script></body></html>
