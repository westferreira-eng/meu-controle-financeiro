<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Controle Financeiro</title></head><body><div id="status" style="font-family:system-ui;padding:40px;text-align:center">Carregando Meu Controle Financeiro…</div><script>(async()=>{const s=document.getElementById('status');try{const names=[0,1,2,3,4,5,6,7].map(n=>`/appdata/part0${n}.txt?v=943a333b`);const rs=await Promise.all(names.map(u=>fetch(u,{cache:'no-store'})));const bad=rs.findIndex(r=>!r.ok);if(bad>=0)throw Error(`Arquivo ${bad} não carregou (HTTP ${rs[bad].status})`);const parts=await Promise.all(rs.map(r=>r.text()));const b64=parts.join('').replace(/[^A-Za-z0-9+/]/g,'');const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';const out=[];for(let i=0;i+3<b64.length;i+=4){const a=A.indexOf(b64[i]),b=A.indexOf(b64[i+1]),c=A.indexOf(b64[i+2]),d=A.indexOf(b64[i+3]);if(a<0||b<0)continue;out.push((a<<2)|(b>>4));if(c>=0)out.push(((b&15)<<4)|(c>>2));if(d>=0)out.push(((c&3)<<6)|d)}const bytes=new Uint8Array(out);if(bytes[0]!==31||bytes[1]!==139)throw Error(`Dados inválidos: gzip não encontrado (${bytes.length} bytes)`);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){s.innerHTML='<h2 style="color:#c33">Não foi possível carregar o sistema</h2><p style="color:#555">'+String(e.message).replace(/[<>&]/g,x=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[x]))+'</p>'}})()</script></body></html>
